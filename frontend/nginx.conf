# frontend — точка входа (API Gateway): отдаёт статику и маршрутизирует
# запросы /api/* в нужный микросервис через Kubernetes Service (DNS-имя).
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    root /usr/share/nginx/html;
    index index.html;

    # Какой под фронтенда ответил
    add_header X-Frontend-Pod $hostname always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/users      { proxy_pass http://users-service:3000; }
    location /api/categories { proxy_pass http://categories-service:3000; }
    location /api/tasks      { proxy_pass http://tasks-service:3000; }
    location /api/comments   { proxy_pass http://tasks-service:3000; }
}
