<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TaskFlow</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">TaskFlow!!!!!!!mee</div>
    <div class="status" id="apiStatus">проверка API…</div>
  </header>

  <main class="board">
    <section class="panel">
      <h2>Категории</h2>
      <form id="catForm" class="row">
        <input id="catName" placeholder="Название категории" required />
        <button type="submit">Добавить</button>
      </form>
      <ul id="catList" class="list"></ul>
    </section>

    <section class="panel">
      <h2>Пользователи</h2>
      <form id="userForm" class="row">
        <input id="userName" placeholder="Имя" required />
        <input id="userEmail" placeholder="Email" type="email" required />
        <button type="submit">Добавить</button>
      </form>
      <ul id="userList" class="list"></ul>
    </section>

    <section class="panel wide">
      <h2>Задачи</h2>
      <form id="taskForm" class="row wrap">
        <input id="taskTitle" placeholder="Заголовок задачи" required />
        <select id="taskUser"><option value="">— пользователь —</option></select>
        <select id="taskCategory"><option value="">— категория —</option></select>
        <button type="submit">Создать задачу</button>
      </form>
      <ul id="taskList" class="list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
