# Конфигурация Prometheus: какие цели (targets) опрашивать
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s       # как часто собирать метрики
      evaluation_interval: 15s

    scrape_configs:
      # 1. Prometheus мониторит сам себя
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # 2. Экспортер узла: CPU, память, диск, сеть самой ноды
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter.monitoring.svc:9100"]

      # 3. Отдельный контейнер cAdvisor (DaemonSet)
      - job_name: cadvisor
        static_configs:
          - targets: ["cadvisor.monitoring.svc:8080"]
        metric_relabel_configs:
          # приводим docker-метки к коротким именам pod / namespace / container
          - source_labels: [container_label_io_kubernetes_pod_name]
            target_label: pod
          - source_labels: [container_label_io_kubernetes_pod_namespace]
            target_label: namespace
          - source_labels: [container_label_io_kubernetes_container_name]
            target_label: container

      # 4. cAdvisor, встроенный в kubelet (метрики контейнеров с метками
      #    container, pod, namespace). Опрашивается через API-сервер.
      - job_name: kubelet-cadvisor
        scrape_interval: 10s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
