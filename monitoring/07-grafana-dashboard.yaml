# Готовый дашборд Grafana: 5 панелей по метрикам задания и 3 переменные
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-taskflow
  namespace: monitoring
data:
  taskflow.json: |
    {
      "uid": "taskflow-k8s",
      "title": "TaskFlow — мониторинг контейнеров Kubernetes",
      "tags": [
        "kubernetes",
        "cadvisor"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(container_cpu_usage_seconds_total{job=\"cadvisor\"}, namespace)",
            "definition": "label_values(container_cpu_usage_seconds_total{job=\"cadvisor\"}, namespace)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "hide": 0,
            "options": []
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(container_cpu_usage_seconds_total{job=\"cadvisor\", namespace=~\"$namespace\"}, pod)",
            "definition": "label_values(container_cpu_usage_seconds_total{job=\"cadvisor\", namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "hide": 0,
            "options": []
          },
          {
            "name": "container",
            "label": "Container",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(container_cpu_usage_seconds_total{job=\"cadvisor\", namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\", container!=\"POD\"}, container)",
            "definition": "label_values(container_cpu_usage_seconds_total{job=\"cadvisor\", namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\", container!=\"POD\"}, container)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "hide": 0,
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "CPU: использование (ядра)",
          "description": "container_cpu_usage_seconds_total — сколько процессорного времени потребляет контейнер",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{job=\"cadvisor\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"\", container!=\"POD\"}[1m]))",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU: троттлинг (секунд в секунду)",
          "description": "container_cpu_cfs_throttled_seconds_total — сколько времени контейнер был ограничен лимитом CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_seconds_total{job=\"cadvisor\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"\", container!=\"POD\"}[1m]))",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memory: рабочий набор",
          "description": "container_memory_working_set_bytes — по этой метрике Kubernetes решает, превышен ли лимит памяти (OOMKilled)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (namespace, pod, container) (container_memory_working_set_bytes{job=\"cadvisor\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Network: принято байт/с",
          "description": "container_network_receive_bytes_total — входящий трафик пода (сеть общая для всех контейнеров пода)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (namespace, pod) (rate(container_network_receive_bytes_total{job=\"cadvisor\", namespace=~\"$namespace\", pod=~\"$pod\"}[1m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Network: отброшено входящих пакетов/с",
          "description": "container_network_receive_packets_dropped_total — потерянные входящие пакеты",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (namespace, pod) (rate(container_network_receive_packets_dropped_total{job=\"cadvisor\", namespace=~\"$namespace\", pod=~\"$pod\"}[1m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
