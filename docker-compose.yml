services:

  # Серверный уровень: Node.js + Express + SQLite
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskflow-backend:latest
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/taskflow.db
    volumes:
      # Данные БД переживают пересоздание контейнера
      - taskflow-db:/app/data
    networks:
      - taskflow-net
    # Порт наружу не публикуется: доступ к API идёт только через nginx
    expose:
      - "3000"

  # Веб-сервер: отдаёт статику фронтенда и проксирует /api в backend
  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge

volumes:
  taskflow-db:
